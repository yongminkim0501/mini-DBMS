name: test

on:
  push:
    branches: ["**"]
  # base 브랜치 제한 없음: 쌓아 올린 PR(base 가 main 이 아닌 PR)에서도 CI 가 돈다.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 로컬 개발 환경과 같은 패치 버전 (README 의 "개발 환경" 참고). 바꿀 때는 README 와 함께 바꾼다.
  PYTHON_PATCH: "3.14.6"
  # 러너에 미리 설치된 파이썬(예: ubuntu 의 3.14.x)을 쓰지 않고 항상 uv 가 관리하는 빌드를 쓴다.
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  pytest:
    name: pytest (${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14.6+gil", "3.14.6t"]
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          # uv 버전마다 내려받을 수 있는 파이썬 목록이 다르므로 uv 도 고정한다.
          version: "0.12.0"

      - name: Install pinned Python (uv managed)
        shell: bash
        run: |
          # uv 0.12.0 은 "3.14.6+gil" 요청에 대해 자동 다운로드를 하지 않으므로 먼저 명시적으로 설치한다.
          # (+gil 은 설치 요청 표기에서 빼고 "3.14.6" 으로 설치하면 GIL 빌드가 설치된다)
          spec="${{ matrix.python }}"
          uv python install "${spec%+gil}"

      - name: Install psql (PostgreSQL client, psql 호환 테스트용)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -q
            sudo apt-get install -y -q postgresql-client
          else
            brew install libpq
            # libpq 는 keg-only 라 PATH 에 직접 넣는다
            echo "$(brew --prefix libpq)/bin" >> "$GITHUB_PATH"
          fi

      - name: Show psql version
        shell: bash
        run: psql --version

      - name: Show interpreter
        shell: bash
        run: |
          uv run --python "${{ matrix.python }}" python - <<'EOF'
          import os, platform, sys, sysconfig
          print("sys.version         :", sys.version)
          print("sys.executable      :", sys.executable)
          print("free-threaded build :", bool(sysconfig.get_config_var("Py_GIL_DISABLED")))
          print("GIL enabled         :", getattr(sys, "_is_gil_enabled", lambda: "N/A")())
          expected = os.environ["PYTHON_PATCH"]
          actual = platform.python_version()
          if actual != expected:
              print(f"::error::python {actual} != pinned {expected}")
              sys.exit(1)
          EOF

      - name: Run pytest
        shell: bash
        run: |
          set -o pipefail
          uv run --python "${{ matrix.python }}" pytest -ra | tee pytest.log

      - name: Verify psql compatibility tests actually ran
        shell: bash
        run: |
          # psql 이 없으면 test_psql.py 는 건너뛰므로(로컬 편의), CI 에서는 건너뛰었으면 실패로 본다
          if grep -E "SKIPPED.*test_psql" pytest.log; then
            echo "::error::psql 호환 테스트가 건너뛰어졌다 (psql 이 PATH 에 없음)"; exit 1
          fi
          ran=$(uv run --python "${{ matrix.python }}" pytest tests/pgwire/test_psql.py -q 2>&1 | tail -1)
          echo "$ran"
          if ! grep -qE "^[0-9]+ passed" <<<"$ran" || grep -q skipped <<<"$ran"; then
            echo "::error::psql 호환 테스트가 실행되지 않았다: $ran"; exit 1
          fi

      - name: Verify interpreter build from pytest header
        shell: bash
        run: |
          header=$(grep -m1 '^minidb: python' pytest.log || true)
          if [ -z "$header" ]; then
            echo "::error::pytest 헤더(minidb: python ...)를 찾을 수 없음"; exit 1
          fi
          echo "$header"
          if ! grep -q "minidb: python ${PYTHON_PATCH}," <<<"$header"; then
            echo "::error::pytest 가 고정 버전 ${PYTHON_PATCH} 이 아닌 파이썬에서 실행됨"; exit 1
          fi
          case "${{ matrix.python }}" in
            *t)
              # free-threaded 빌드여야 하고, GIL 이 다시 켜져 있으면 안 된다
              # (free-threading 미지원 C 확장을 import 하면 GIL 이 재활성화될 수 있음)
              if ! grep -q 'free-threaded build=True' <<<"$header"; then
                echo "::error::${{ matrix.python }} 인데 free-threaded 빌드가 아님"; exit 1
              fi
              if grep -q 'GIL enabled=True' <<<"$header"; then
                echo "::error::${{ matrix.python }} 인데 GIL enabled=True"; exit 1
              fi
              ;;
            *+gil)
              if grep -q 'free-threaded build=True' <<<"$header"; then
                echo "::error::${{ matrix.python }} 인데 free-threaded build=True"; exit 1
              fi
              ;;
          esac
